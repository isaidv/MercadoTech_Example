# CI de MercadoTech (Fase 6.7, MercadoTech_sesion6.md) — patrón probado en
# ReadHub, con sus lecciones ya incorporadas (decisiones 10/11/12 de la
# spec). Dos jobs encadenados: `checks` (rápido, sin Docker) y `e2e`
# (necesita `checks` en verde, levanta Supabase local con Docker).
#
# CERO secretos: `checks` no toca red (Vitest usa valores mock inyectados
# en vitest.config.mts); `e2e` lee las credenciales del stack Supabase
# EFÍMERO de este mismo job con `supabase status -o json` — son las claves
# estándar que trae cualquier `supabase start` local, no protegen nada
# real (decisión 11: el contenedor se destruye al terminar el job), así
# que viajan como env vars normales, nunca como GitHub Secrets.

name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Un push nuevo a la misma rama (o una nueva corrida del mismo PR) cancela
# la corrida anterior en curso — no tiene sentido terminarla.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          # Los dos lockfiles del repo (raíz y mcp/) — así la caché de npm
          # invalida sola si cualquiera de los dos cambia.
          cache-dependency-path: |
            package-lock.json
            mcp/package-lock.json

      # Decisión 10 (lección real de ReadHub): el lockfile de este repo lo
      # generó npm 11.6.2 en Windows. Un runner de Linux con OTRA versión
      # de npm resuelve las dependencias OPCIONALES (los binarios nativos
      # específicos de plataforma que trae, por ejemplo, esbuild/Rollup)
      # distinto de como se resolvieron al generar el lockfile — y `npm ci`
      # falla con "Missing: <paquete> from lock file" aunque el lockfile
      # esté perfectamente bien. Pinnear la MISMA versión exacta que
      # `packageManager` en package.json elimina esa diferencia de raíz.
      - name: Pinnear npm a la versión que generó el lockfile (packageManager)
        run: npm install -g npm@11.6.2

      - name: Instalar dependencias
        run: npm ci

      - name: Type-check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Tests + cobertura
        run: npm run test:coverage

      # `mcp/` es un proyecto npm propio (su propio lockfile, su propio
      # tsconfig) — no se testea en esta sesión (CLAUDE.md), pero su
      # type-check sí entra al gate: un tipo roto ahí no debe llegar a main.
      - name: Instalar dependencias (mcp/)
        working-directory: mcp
        run: npm ci

      - name: Type-check (mcp/)
        working-directory: mcp
        run: npm run type-check

      - name: Subir cobertura como artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  e2e:
    name: e2e
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mcp/package-lock.json

      # Mismo pin que en `checks` — ver el comentario largo de ese job
      # (decisión 10). Este job también corre `npm ci`, así que también
      # puede pisar el mismo error de lockfile si no se pinnea acá.
      - name: Pinnear npm a la versión que generó el lockfile (packageManager)
        run: npm install -g npm@11.6.2

      - name: Instalar dependencias
        run: npm ci

      # Los binarios de los navegadores de Playwright NO cambian con cada
      # commit — solo con la versión de `@playwright/test` del lockfile.
      # Cachearlos por el hash del lockfile evita descargar ~300 MB en
      # cada corrida cuando la dependencia no cambió.
      - name: Cachear navegadores de Playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # Solo Chromium en CI (decisión de la Fase 6.4: Firefox quedó
      # bloqueado por el sandbox del entorno de desarrollo local — en
      # Actions no hay ese problema, pero los 3 navegadores en cada corrida
      # sería 3x el tiempo sin agregar cobertura real distinta; los 3
      # quedan para correr localmente antes de un cambio grande de UI).
      # `--with-deps` instala las librerías de sistema que Chromium
      # necesita en el runner — eso NO lo cubre la caché de arriba, así que
      # este paso corre siempre, tenga caché de binarios o no.
      - name: Instalar Chromium de Playwright
        run: npx playwright install --with-deps chromium

      - name: Instalar Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      # Docker ya viene preinstalado y corriendo en `ubuntu-latest` — no
      # hace falta ningún paso extra para tenerlo disponible.
      - name: Levantar Supabase local
        run: supabase start

      # Migraciones + seed — mismo contrato que en local (docs/BITACORA.md,
      # "supabase db reset" es parte del contrato de E2E, no un detalle).
      - name: Resetear base de datos (migraciones + seed)
        run: supabase db reset

      # Decisión 11: en CI no existe `.env.local` (nunca se commitea). Acá
      # no hace falta: el stack de Supabase que acaba de arrancar imprime
      # sus propias credenciales — las mismas que `supabase status -o env`
      # muestra en local. Se leen dinámicas, no se pegan fijas en ningún
      # lado (ni acá ni como GitHub Secret) porque no son secretas: viven y
      # mueren con este job.
      - name: Leer credenciales del Supabase local
        id: supabase
        run: |
          STATUS=$(supabase status -o json)
          echo "api_url=$(echo "$STATUS" | jq -r '.API_URL')" >> "$GITHUB_OUTPUT"
          echo "anon_key=$(echo "$STATUS" | jq -r '.ANON_KEY')" >> "$GITHUB_OUTPUT"
          echo "service_role_key=$(echo "$STATUS" | jq -r '.SERVICE_ROLE_KEY')" >> "$GITHUB_OUTPUT"

      # Decisión 12: `playwright.config.ts` hace `npm run build && npm run
      # start` cuando `CI` está seteada (GitHub Actions ya la setea sola en
      # cada step, no hace falta declararla acá) — paridad real con
      # producción, no el dev server de Turbopack. Como `next build` graba
      # las `NEXT_PUBLIC_*` en el bundle en tiempo de build, las env vars
      # de este paso tienen que estar ANTES de que Playwright dispare ese
      # build, no después.
      #
      # Decisión 8: ningún E2E afirma texto generado por IA — por eso NO
      # hace falta ninguna clave de Anthropic/Voyage/HuggingFace acá. Si
      # `/api/v1/reindex` falla por falta de `ANTHROPIC_API_KEY`/
      # `VOYAGE_API_KEY`, es un `console.warn` silencioso
      # (`services/indexing-trigger.service.ts`) — nunca rompe un test.
      - name: E2E (chromium)
        run: npx playwright test --project=chromium
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ steps.supabase.outputs.api_url }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ steps.supabase.outputs.anon_key }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ steps.supabase.outputs.service_role_key }}
          NEXT_PUBLIC_SITE_URL: http://localhost:3000

      # Solo si algo falló: en verde el reporte no aporta nada y solo
      # ocupa espacio de artefactos.
      - name: Subir reporte + screenshots (solo si falla)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 14

      # Siempre, haya pasado lo que haya pasado arriba — no dejar el
      # contenedor de Supabase colgado en el runner.
      - name: Apagar Supabase
        if: always()
        run: supabase stop
